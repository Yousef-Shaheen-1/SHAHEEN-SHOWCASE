<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SHAHEEN VIP — public showcase and navigation." />
    <title>SHAHEEN VIP</title>
    <style>
      :root {
        --bg: #121212;
        --panel: #191919;
        --line: rgba(255, 255, 255, 0.12);
        --text: #ffffff;
        --muted: #a6a6a6;
        --accent: #d9d9d9;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;
        background: radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 40%), #121212;
      }
      .card {
        width: min(600px, 100%);
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        padding: 32px 28px;
        text-align: center;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 16px 0 10px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.1;
        letter-spacing: -0.06em;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 20px;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 12px 18px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgba(255,255,255,0.03);
        color: var(--text);
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }
      a:hover {
        transform: translateY(-1px);
        border-color: rgba(255,255,255,0.3);
      }
      .primary {
        background: var(--accent);
        color: #121212;
      }
      .secondary {
        background: rgba(255,255,255,0.02);
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const primaryUrl = 'https://shaheen-bilingual-command-hub.lovable.app/';
        const altUrl = 'https://shaheen-gp.pages.dev/';

        const primaryLink = document.querySelector('[data-primary-link]');
        const altLink = document.querySelector('[data-alt-link]');

        if (primaryLink) {
          primaryLink.href = primaryUrl;
          primaryLink.setAttribute('target', '_self');
        }

        if (altLink) {
          altLink.href = altUrl;
          altLink.setAttribute('target', '_self');
        }
      });
    </script>
  </head>
  <body>
    <main class="card" aria-live="polite">
      <div class="eyebrow">SHAHEEN GROUP</div>
      <h1>SHAHEEN VIP</h1>
      <p>زيارة الموقع الرسمي أو استخدام الرابط البديل.</p>
      <div class="actions">
        <a class="primary" href="https://shaheen-bilingual-command-hub.lovable.app/" data-primary-link target="_self">استكشف الموقع الرئيسي</a>
        <a class="secondary" href="https://shaheen-gp.pages.dev/" data-alt-link target="_self">فتح الموقع عبر الرابط البديل</a>
      </div>
    </main>
  </body>
</html>
